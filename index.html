<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6fa" />
    <title>Layerbase Mini</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">Layerbase</div>
        
        <nav class="navigation">
          <a href="#" class="nav-item active">All Notes</a>
          <a href="#" class="nav-item">Favorites</a>

          <article class="note-card">
            <h2>Creative Ideas</h2>

          <article class="note-card">

            <p>This is the content of the third note.</p>
          </article>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
